name: Release

# Runs when a version tag is pushed (git push origin v1.2.3) or when a release is
# published from the GitHub web UI. Either way the APK ends up attached to the release.
on:
  push:
    tags: [ 'v*' ]
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build release APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/PuskarUIN-release.apk "PuskarUIN-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="PuskarUIN-${GITHUB_REF_NAME}.apk"
          # The release may already exist if it was drafted on GitHub; then just attach the APK.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" \
              --title "PuskarUIN ${GITHUB_REF_NAME}" \
              --notes-file "docs/release-notes/${GITHUB_REF_NAME}.md"
          fi
