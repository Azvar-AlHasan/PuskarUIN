name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build release APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/PuskarUIN-release.apk "PuskarUIN-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "PuskarUIN-${GITHUB_REF_NAME}.apk" \
            --title "PuskarUIN ${GITHUB_REF_NAME}" \
            --notes-file docs/release-notes/${GITHUB_REF_NAME}.md
